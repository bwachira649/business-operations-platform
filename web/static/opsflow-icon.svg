<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512"
    role="img"
    aria-labelledby="title desc"
>
    <title id="title">OpsFlow</title>
    <desc id="desc">
        Geometric OpsFlow O mark with an electric blue flow arc and node.
    </desc>

    <!-- Transparent background -->

    <!-- Deep navy squircle O ring -->
    <path
        fill="#0B1530"
