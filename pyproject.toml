[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-operations-platform"
version = "0.1.0"
description = "A full-stack business operations platform for managing customers, products, orders, inventory, payments, notifications, reporting, and operational workflows."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Brian Wachira" }
]
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "PyJWT>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "redis>=6.4,<7.0",
    "httpx>=0.28,<1.0",
    "httpx2>=2.13,<3.0",
    "jinja2>=3.1,<4.0",
    "email-validator>=2.2,<3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-cov>=6.2,<8.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.13,<1.0"
]

[project.scripts]
business-platform = "business_operations.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]